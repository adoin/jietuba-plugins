[package]
name = "jietuba-preview-plugins"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
age = "0.12.1"
anyhow = "1"
base64 = "0.22.1"
flate2 = "1"
rhai = "1.27.0"
rtf-parser-tt = "0.6.0"
rusqlite = { version = "0.32", features = ["bundled", "backup", "serialize"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
tar = "0.4"
tempfile = "3"

[[bin]]
name = "json-preview"
path = "src/json_preview.rs"

[[bin]]
name = "markdown-preview"
path = "src/markdown_preview.rs"

[[bin]]
name = "rtf-preview"
path = "src/rtf_preview.rs"

[[bin]]
name = "format-inspector"
path = "src/format_inspector.rs"

[[bin]]
name = "json-pretty"
path = "src/json_pretty.rs"

[[bin]]
name = "secret-filter"
path = "src/secret_filter.rs"

[[bin]]
name = "source-exclusions"
path = "src/source_exclusions.rs"

[[bin]]
name = "script-transform"
path = "src/script_transform.rs"

[[bin]]
name = "clipboard-backup"
path = "src/clipboard_backup.rs"

[[bin]]
name = "screenshot-extension"
path = "src/screenshot_extension.rs"
